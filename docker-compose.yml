services:
  getafix:
    image: incredibad/getafix:latest
    container_name: getafix
    ports:
      - "4220:4220"
    volumes:
      - footrack_data:/data
    environment:
      - SECRET_KEY=${SECRET_KEY:-change-this-secret-key-in-production}
    restart: unless-stopped

volumes:
  footrack_data:
    external: true
